<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ニーズリスト</title>
    <link rel="stylesheet" href="../../style.css">
</head>
<body>

    <div class="container">
        <header>
                <h1>ニーズリスト作成</h1>
            <div>
                <button class="btn btn-secondary" onclick="resetToDefault()">初期化</button>
            </div>
        </header>

        <div class="card">
            <div class="card-title">ステークホルダの追加</div>
            <div class="form-row">
                <input type="text" id="new-top-category-input" class="input-flex" placeholder="例: 運営スタッフ, スポンサー, 来場者">
                <button class="btn btn-primary" onclick="addTopCategory()">追加</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">現在のニーズリスト</div>
            <div id="tree-root" class="tree-container">データを読み込み中...</div>
        </div>

        <div class="footer-bar">
            <div>
                <span id="data-status" style="font-size: 0.85rem; color: #718096;">変更内容は自動保存されています</span>
            </div>
            <button class="btn btn-success" onclick="saveAndNavigate()">確定して表（出力画面）を出力 →</button>
        </div>
    </div>

    <script>
        const defaultData = {
 
        };

        let needsData = {};

        function init() {
            const saved = localStorage.getItem('seat_needs_data');
            if (saved) {
                try {
                    needsData = JSON.parse(saved);
                } catch (e) {
                    needsData = JSON.parse(JSON.stringify(defaultData));
                }
            } else {
                needsData = JSON.parse(JSON.stringify(defaultData));
            }
            renderTree();
        }

        function autoSave() {
            localStorage.setItem('seat_needs_data', JSON.stringify(needsData));
            const statusEl = document.getElementById('data-status');
            statusEl.innerText = "変更をローカルに保存しました (" + new Date().toLocaleTimeString() + ")";
        }

        function renderTree() {
            const root = document.getElementById('tree-root');
            const topKeys = Object.keys(needsData);

            if (topKeys.length === 0) {
                root.innerHTML = '<p style="color: #a0aec0; text-align: center; padding: 20px;">ステークホルダが登録されていません。上のフォームから追加してください。</p>';
                return;
            }

            let html = '';

            topKeys.forEach(topKey => {
                const val = needsData[topKey];
                const isArray = Array.isArray(val);

                html += `
                    <div class="top-category-block">
                        <div class="top-category-header">
                            <span> ${escapeHtml(topKey)}</span>
                            <div>
                                ${isArray ? `<button class="btn btn-secondary" style="font-size: 0.75rem; padding: 3px 8px; margin-right: 5px;" onclick="convertToGroup('${escapeHtml(topKey)}')">サブカテゴリを追加</button>` : ''}
                                <button class="btn btn-danger" onclick="deleteTopCategory('${escapeHtml(topKey)}')">削除</button>
                            </div>
                        </div>
                `;

                if (isArray) {
                    html += `<div style="padding: 10px 15px;">`;
                    html += renderItemsList(val, [topKey]);
                    html += renderAddInlineForm([topKey], "＋ ニーズを追加");
                    html += `</div>`;
                } else if (typeof val === 'object' && val !== null) {
                    const subKeys = Object.keys(val);
                    
                    subKeys.forEach(subKey => {
                        const items = val[subKey] || [];
                        html += `
                            <div class="sub-category-block">
                                <div class="sub-category-header">
                                    <span>└ ${escapeHtml(subKey)}</span>
                                    <button class="btn btn-danger" onclick="deleteSubCategory('${escapeHtml(topKey)}', '${escapeHtml(subKey)}')">削除</button>
                                </div>
                                ${renderItemsList(items, [topKey, subKey])}
                                ${renderAddInlineForm([topKey, subKey], "＋ ニーズを追加")}
                            </div>
                        `;
                    });

                    html += `
                        <div style="padding: 10px 15px; background-color: #faf5ff; border-top: 1px dashed #d6bcfa;">
                            <div class="add-inline-form">
                                <input type="text" id="add-sub-${escapeHtml(topKey)}" class="input-flex" placeholder="＋ サブカテゴリを追加 (例: 若年層, VIP)" onkeydown="if(event.key==='Enter') addSubCategory('${escapeHtml(topKey)}')">
                                <button class="btn btn-primary" style="font-size: 0.8rem;" onclick="addSubCategory('${escapeHtml(topKey)}')">追加</button>
                            </div>
                        </div>
                    `;
                }

                html += `</div>`;
            });

            root.innerHTML = html;
        }

        function renderItemsList(items, path) {
            if (!items || items.length === 0) {
                return '<p style="font-size: 0.8rem; color: #a0aec0; margin: 4px 0;">(ニーズ項目なし)</p>';
            }
            let html = '<ul class="items-list">';
            items.forEach((item, idx) => {
                const pathStr = JSON.stringify(path);
                html += `
                    <li>
                        <span>・ ${escapeHtml(item)}</span>
                        <button class="btn btn-danger" onclick='deleteNeedItem(${pathStr}, ${idx})'>×</button>
                    </li>
                `;
            });
            html += '</ul>';
            return html;
        }

        function renderAddInlineForm(path, placeholder) {
            const pathId = path.join('___');
            const pathStr = JSON.stringify(path);
            return `
                <div class="add-inline-form">
                    <input type="text" id="input-${pathId}" class="input-flex" placeholder="${placeholder}" onkeydown='if(event.key==="Enter") addNeedItem(${pathStr})'>
                    <button class="btn btn-secondary" style="font-size: 0.8rem;" onclick='addNeedItem(${pathStr})'>追加</button>
                </div>
            `;
        }

        function addTopCategory() {
            const input = document.getElementById('new-top-category-input');
            const name = input.value.trim();
            if (!name) return;
            if (needsData[name]) {
                alert('既に存在するステークホルダ名です。');
                return;
            }
            needsData[name] = [];
            input.value = '';
            autoSave();
            renderTree();
        }

        function deleteTopCategory(topKey) {
            if (confirm(`「${topKey}」とその下のデータをすべて削除しますか？`)) {
                delete needsData[topKey];
                autoSave();
                renderTree();
            }
        }

        function addSubCategory(topKey) {
            const input = document.getElementById(`add-sub-${topKey}`);
            const subName = input.value.trim();
            if (!subName) return;

            if (Array.isArray(needsData[topKey])) {
                needsData[topKey] = {};
            }
            if (!needsData[topKey][subName]) {
                needsData[topKey][subName] = [];
            }
            input.value = '';
            autoSave();
            renderTree();
        }

        function deleteSubCategory(topKey, subKey) {
            if (confirm(`サブカテゴリ「${subKey}」を削除しますか？`)) {
                delete needsData[topKey][subKey];
                autoSave();
                renderTree();
            }
        }

        function convertToGroup(topKey) {
            const currentItems = needsData[topKey];
            needsData[topKey] = {};
            autoSave();
            renderTree();
        }

        function addNeedItem(path) {
            const pathId = path.join('___');
            const input = document.getElementById(`input-${pathId}`);
            const text = input.value.trim();
            if (!text) return;

            if (path.length === 1) {
                needsData[path[0]].push(text);
            } else if (path.length === 2) {
                needsData[path[0]][path[1]].push(text);
            }

            input.value = '';
            autoSave();
            renderTree();

            setTimeout(() => {
                const el = document.getElementById(`input-${pathId}`);
                if (el) el.focus();
            }, 50);
        }

        function deleteNeedItem(path, idx) {
            if (path.length === 1) {
                needsData[path[0]].splice(idx, 1);
            } else if (path.length === 2) {
                needsData[path[0]][path[1]].splice(idx, 1);
            }
            autoSave();
            renderTree();
        }

        function resetToDefault() {
            if (confirm('初期データにリセットしますか？現在の編集内容は上書きされます。')) {
                needsData = JSON.parse(JSON.stringify(defaultData));
                autoSave();
                renderTree();
            }
        }

        function saveAndNavigate() {
            localStorage.setItem('seat_needs_data', JSON.stringify(needsData));
            window.location.href = 'output.html';
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        init();
    </script>
</body>
</html>
