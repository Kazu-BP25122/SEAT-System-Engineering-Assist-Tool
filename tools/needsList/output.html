<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ニーズリスト</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 30px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 900px;
            margin-top: 20px;
        }
        th, td {
            border: 2px solid #000;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #f4f4f4;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>ニーズリスト</h1>
    
    <div id="table-container">データを読み込み中...</div>

    <script>
        function loadAndRenderTable() {
            try {
                // localStorage から入力画面で保存されたデータを取得する
                const saved = localStorage.getItem('seat_needs_data');
                
                let needsData;
                if (saved) {
                    needsData = JSON.parse(saved);
                } else {
                    // localStorageにデータが無い場合の初期データ（フォールバック）
                    needsData = {
                        "来場者": {
                            "ファミリー": [
                                "美味しい物を食べたい",
                                "列に並びたくない",
                                "世界観に没頭したい"
                            ],
                            "学生": [
                                "お土産が欲しい",
                                "スマホの充電をしたい",
                                "安く楽しみたい"
                            ]
                        },
                        "出展者": [
                            "来場者の感想を聞きたい",
                            "達成感を得たい",
                            "トラブルを防ぎたい"
                        ]
                    };
                }
                
                renderTable(needsData);
            } catch (error) {
                console.error("データの読み込みに失敗しました:", error);
                document.getElementById('table-container').innerText = 
                    "データの読み込みに失敗しました。";
            }
        }

        // どんな構造のJSONでも自動解析して表を描画する汎用関数
        function renderTable(needsData) {
            const container = document.getElementById('table-container');
            
            // 1. カラム（最下層の列）のリストと構造を解析
            const topCategories = Object.keys(needsData); // ['来場者', '出展者'] など
            const columns = []; // 最下層の列情報 [{ parent: '来場者', name: 'ファミリー', list: [...] }, ...]
            
            topCategories.forEach(topKey => {
                const val = needsData[topKey];
                if (Array.isArray(val)) {
                    // サブカテゴリがない場合
                    columns.push({
                        topCategory: topKey,
                        subCategory: null,
                        items: val
                    });
                } else if (typeof val === 'object' && val !== null) {
                    // サブカテゴリが存在する場合
                    Object.keys(val).forEach(subKey => {
                        columns.push({
                            topCategory: topKey,
                            subCategory: subKey,
                            items: val[subKey] || []
                        });
                    });
                }
            });

            // サブカテゴリが1つでもあるかチェック（ヘッダーを2段にするか判断）
            const hasSubHeader = columns.some(col => col.subCategory !== null);

            let html = '<table><thead>';

            // 2. ヘッダー 1行目（大カテゴリ）の自動生成
            html += '<tr>';
            topCategories.forEach(topKey => {
                // この大カテゴリ配下にいくつ列が存在するかカウント（colspan）
                const childCols = columns.filter(col => col.topCategory === topKey);
                const colSpan = childCols.length;
                
                // サブカテゴリ全体がない場合はrowspan="2"、ある場合は通常表示
                if (hasSubHeader && childCols.every(col => col.subCategory === null)) {
                    html += `<th colspan="${colSpan}" rowspan="2">${topKey}</th>`;
                } else {
                    html += `<th colspan="${colSpan}">${topKey}</th>`;
                }
            });
            html += '</tr>';

            // 3. ヘッダー 2行目（サブカテゴリ）の自動生成（必要な場合のみ）
            if (hasSubHeader) {
                html += '<tr>';
                columns.forEach(col => {
                    if (col.subCategory !== null) {
                        html += `<th>${col.subCategory}</th>`;
                    }
                });
                html += '</tr>';
            }
            html += '</thead>';

            // 4. データ行の自動生成
            html += '<tbody>';
            // 最も要素数の多い列の長さを自動計算（maxRows）
            const maxRows = Math.max(...columns.map(col => col.items.length), 0);

            for (let i = 0; i < maxRows; i++) {
                html += '<tr>';
                columns.forEach(col => {
                    const itemText = col.items[i] || "";
                    html += `<td>${itemText}</td>`;
                });
                html += '</tr>';
            }

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        loadAndRenderTable();
    </script>

</body>
</html>
